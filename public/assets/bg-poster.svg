<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="立志楼夜景 占位海报">
  <!-- PLACEHOLDER poster. Replace this file with your own photo:
       public/assets/bg-poster.jpg  (>= 1920x1080 recommended)
       The code points at  ./assets/bg-poster.jpg . -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050810"/>
      <stop offset="34%" stop-color="#0c1526"/>
      <stop offset="62%" stop-color="#1b2a44"/>
      <stop offset="78%" stop-color="#3a4a63"/>
      <stop offset="88%" stop-color="#6b5f66"/>
      <stop offset="100%" stop-color="#14161f"/>
    </linearGradient>
    <linearGradient id="slab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2438"/>
      <stop offset="100%" stop-color="#0d1420"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="86%" r="42%">
      <stop offset="0%" stop-color="#ffd9a3" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#ffb877" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffb877" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="46%" r="72%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.62"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>

  <!-- distant skyline -->
  <g fill="#0a0f1a">
    <rect x="0" y="560" width="180" height="220"/>
    <rect x="200" y="620" width="140" height="160"/>
    <rect x="1620" y="590" width="150" height="190"/>
    <rect x="1790" y="640" width="130" height="140"/>
    <rect x="1180" y="600" width="120" height="180"/>
  </g>

  <!-- the teaching building: west wing, landmark block, east wing -->
  <g>
    <rect x="150" y="640" width="330" height="180" fill="url(#slab)"/>
    <rect x="1420" y="600" width="360" height="220" fill="url(#slab)"/>
    <rect x="560" y="470" width="800" height="350" fill="url(#slab)"/>
    <rect x="820" y="430" width="280" height="44" fill="#141d2e"/>
    <rect x="500" y="640" width="920" height="180" fill="#101827"/>
  </g>

  <!-- window grid -->
  <g fill="#ffd9a3" opacity="0.78">
    <rect x="620" y="500" width="34" height="14"/><rect x="690" y="500" width="34" height="14"/>
    <rect x="830" y="500" width="34" height="14"/><rect x="970" y="500" width="34" height="14"/>
    <rect x="1180" y="500" width="34" height="14"/><rect x="1250" y="500" width="34" height="14"/>
    <rect x="620" y="560" width="34" height="14"/><rect x="760" y="560" width="34" height="14"/>
    <rect x="1040" y="560" width="34" height="14"/><rect x="1250" y="560" width="34" height="14"/>
    <rect x="690" y="690" width="34" height="14"/><rect x="900" y="690" width="34" height="14"/>
    <rect x="1180" y="690" width="34" height="14"/><rect x="1320" y="690" width="34" height="14"/>
  </g>
  <g fill="#bcd7f5" opacity="0.6">
    <rect x="760" y="500" width="34" height="14"/><rect x="900" y="500" width="34" height="14"/>
    <rect x="1040" y="500" width="34" height="14"/><rect x="690" y="560" width="34" height="14"/>
    <rect x="900" y="560" width="34" height="14"/><rect x="1180" y="560" width="34" height="14"/>
    <rect x="760" y="690" width="34" height="14"/><rect x="1040" y="690" width="34" height="14"/>
    <rect x="1250" y="690" width="34" height="14"/>
  </g>

  <!-- vertical fins -->
  <g stroke="#0b1120" stroke-width="3" opacity="0.9">
    <path d="M600 470V820M700 470V820M800 470V820M900 470V820M1000 470V820M1100 470V820M1200 470V820M1300 470V820"/>
  </g>

  <!-- lit entrance -->
  <rect x="790" y="640" width="340" height="180" fill="#ffd9a3" opacity="0.16"/>
  <rect x="860" y="690" width="200" height="130" fill="#ffe6c2" opacity="0.16"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>

  <!-- ground and vignette -->
  <rect y="800" width="1920" height="280" fill="#070a11"/>
  <rect width="1920" height="1080" fill="url(#vig)"/>
</svg>
